description: >-
  FinOps view of Levels spend. Levels is a consumer metabolic-health
  subscription, not a usage-metered API product, so there is no API
  consumption billing to manage. Cost is a flat monthly or annual membership
  fee (HSA/FSA eligible) bundling the app, CGM sensors, and - on higher tiers -
  lab panels and consultations. No developer/API meters exist because Levels
  publishes no public or partner API.
notes: >-
  This artifact is not reconciled against any usage-based billing because none
  exists. Membership prices are subject to change; verify on levelshealth.com /
  the Levels support pricing page. If a developer/partner API with metered
  billing is later introduced, replace the subscription model below with FOCUS
  usage meters.
