meters:
- name: membership_subscription
  description: >-
    Flat consumer membership fee billed monthly or annually per member. Not a
    usage meter; the membership bundles app access and CGM sensors.
  unit: subscriptions
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: >-
    Track membership tier and renewal date; there is no per-call API spend to
    inspect because no API exists.
- name: Allocation
  description: >-
    Map the membership to the individual member (or HSA/FSA account) it belongs
    to; no per-workload API tagging applies.
- name: Optimization
  description: >-
    Choose the membership tier matching needed lab and consultation inclusions;
    pay annually to reduce effective monthly cost; use HSA/FSA eligibility.
- name: Accountability
  description: >-
    Review membership value against usage at renewal; no API cost center
    applies.
