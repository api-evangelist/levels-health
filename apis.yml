name: Levels
kind: company
description: Levels is a continuous glucose monitoring (CGM) metabolic-health app that
  pairs glucose sensors with lab testing and personalized guidance. The platform is
  a consumer product delivered through iOS, Android, and a member web portal; it
  consumes health data (Apple Health, wearables, uploaded labs) but does not publish
  a documented public or partner developer API as of this catalog date.
